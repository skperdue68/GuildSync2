<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alphabet Mafia — Guild Chat</title>
  <script src="embedded.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">AM</span>
        <span class="brand-text">
          <span class="brand-title">Alphabet Mafia</span>
          <span class="brand-subtitle">ESO guild chat archive</span>
        </span>
      </div>
      <div class="header-actions">
        <span id="connection-status" class="connection-badge" data-state="connecting">Connecting…</span>
        <button id="follow-button" class="follow-button" type="button" aria-pressed="false" data-following="false" data-paused="false">Follow newest</button>
        <button id="refresh-button" class="refresh-button" type="button">REFRESH</button>
      </div>
    </header>

    <section class="toolbar" aria-label="Chat filters">
      <label class="search-field">
        <span class="field-label">Search</span>
        <input id="search-input" type="search" placeholder="Message text…" autocomplete="off" spellcheck="false">
      </label>
      <div class="range-field">
        <span class="field-label">Date range</span>
        <div class="range-inputs">
          <label class="range-input">
            <span>From</span>
            <input id="range-start" type="date">
          </label>
          <label class="range-input">
            <span>To</span>
            <input id="range-end" type="date">
          </label>
          <button id="range-clear" class="clear-button" type="button">CLEAR</button>
        </div>
      </div>
      <div id="embedded-actions" class="embedded-actions" aria-label="Chat controls"></div>
    </section>

    <section class="table-card">
      <button id="new-messages-pill" class="new-pill" type="button" hidden></button>
      <div class="table-viewport">
        <div class="table-scroll" id="table-scroll">
          <table class="chat-table">
            <thead>
              <tr>
                <th scope="col" class="align-right">Local time</th>
                <th scope="col" class="align-right">Sender</th>
                <th scope="col">Message</th>
              </tr>
              <tr class="date-tab-row" id="date-tab-row" hidden>
                <th colspan="3" scope="colgroup"><span id="date-tab" class="date-tab"></span></th>
              </tr>
            </thead>
            <tbody id="chat-body"></tbody>
          </table>
        </div>
        <button id="edge-top" class="edge-strip edge-strip-top" type="button" hidden>
          <span id="edge-top-text"></span>
        </button>
        <button id="edge-bottom" class="edge-strip edge-strip-bottom" type="button" hidden>
          <span id="edge-bottom-text"></span>
        </button>
      </div>
      <div class="table-footer">
        <span class="footer-left">
          <span id="table-summary">Loading…</span>
        </span>
        <span id="latest-data" class="latest-data">MOST RECENT DATA: —</span>
        <span class="footer-right">
          <span id="table-error" class="table-error" role="alert" hidden></span>
          <span id="last-update" class="last-update">LAST SCREEN REFRESH: —</span>
        </span>
      </div>
    </section>
  </div>

  <div id="row-tooltip" class="row-tooltip" role="tooltip" hidden></div>

  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>
  <p class="row-hint">Double-click a line to copy a link to it</p>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
