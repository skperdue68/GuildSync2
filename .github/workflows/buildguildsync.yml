  name: Build GuildSync

  permissions:
    contents: write
    pull-requests: write

  on:
    release:
      types: [published]
    workflow_dispatch:
      inputs:
        tag:
          description: 'Release tag to build, such as v1.0.1'
          required: true

  env:
    RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    GO_VERSION: '1.26.x'
    NODE_VERSION: '24'
    WAILS_VERSION: 'v3.1.0'
    MACOSX_DEPLOYMENT_TARGET: '12.0'

  jobs:
    build:
      name: Build ${{ matrix.name }}
      runs-on: ${{ matrix.os }}

      strategy:
        fail-fast: false
        matrix:
          include:
            - name: windows-amd64
              os: windows-latest
              artifact_name: GuildSync-windows-amd64
              wails_args: ''
              installer_kind: windows
            - name: macos-universal
              os: macos-latest
              artifact_name: GuildSync-macos
              wails_args: 'UNIVERSAL=true'
              installer_kind: macos
            - name: linux-amd64
              os: ubuntu-24.04
              artifact_name: GuildSync-linux-amd64
              wails_args: ''
              installer_kind: linux

      defaults:
        run:
          working-directory: GO/GuildSync-Frontend-Client

      steps:
        - name: Checkout
          uses: actions/checkout@v7
          with:
            ref: ${{ env.RELEASE_TAG }}

        - name: Test macOS installer file operations
          if: runner.os == 'macOS'
          shell: bash
          working-directory: .
          run: |
            bash -n Installer/Mac/install-guildsync.sh
            bash -n Installer/Mac/make-macos-installer.sh
            bash Installer/Mac/installer.test.sh

        - name: Setup Go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ env.GO_VERSION }}
            cache-dependency-path: GO/GuildSync-Frontend-Client/go.sum

        - name: Determine GuildSync version
          shell: bash
          working-directory: .
          env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
          run: |
            set -euo pipefail
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH, such as v1.2.7." >&2
              exit 1
            fi
            VERSION="${RELEASE_TAG#v}"
            echo "GUILDSYNC_VERSION=${VERSION}" >> "$GITHUB_ENV"
            echo "GuildSync version: ${VERSION}"

        - name: Update versioned files
          shell: bash
          working-directory: .
          run: |
            go run tools/update-version.go "${GUILDSYNC_VERSION}"
            go run tools/update-version.go --check "${GUILDSYNC_VERSION}"

        - name: Setup Node
          uses: actions/setup-node@v7
          with:
            node-version: ${{ env.NODE_VERSION }}
            cache: npm
            cache-dependency-path: GO/GuildSync-Frontend-Client/frontend/package-lock.json
